project:
  type: website
  resources:
    - references.bib
  title: BibVik
  preview:
    port: 7777
    browser: false

website:
  title: "Digital Archaeology Maintainathon"
  site-url: https://sslarch.github.io/maintainathon/
  repo-url: https://github.com/sslarch/maintainathon
  bread-crumbs: true
  page-navigation: false
  favicon: images/sig_ssla_logo.svg

  page-footer:
    center: |
      [CC0 1.0 Universal](https://creativecommons.org/publicdomain/zero/1.0/) | 
      This page is built with ❤️ and [Quarto](https://quarto.org/), with theme from [vetiver](https://github.com/rstudio/vetiver.rstudio.com)
  search: false
  navbar:
    pinned: true
    href: https://sslarch.github.io/maintainathon/
    right:
    - text: "Home"
      href: index.qmd
    - text: "Resources"
      href: resources/index.qmd
    - text: "Reading list"
      href: reading.qmd
    - text: "2026 Recap"
      href: 2026-recap.qmd
    - icon: github
      href: https://github.com/sslarch/maintainathon
      target: _blank
    - icon: mastodon
      href: https://archaeo.social/@CAA_SSLA
      target: _blank
  sidebar: false
format:
  html:
    theme:
      light: [cosmo, styles/light.scss]
      dark: [cosmo, styles/dark.scss]
    respect-user-color-scheme: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
    css: styles/home.css
    toc: false
    link-external-newwindow: true
    page-layout: full
    number-sections: false
      

